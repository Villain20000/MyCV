    <meta property="og:title" content="Ioannis Ioannidis — Full-Stack Developer" />

      content="Angular, TypeScript, PHP and Node.js. HealthTech, e-commerce, civic and legal tech. Open to new opportunities."
    />
    <meta property="og:image" content="assets/direct-democracy-screenshot.webp" />

      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var savedTheme = null;
        try {
          savedTheme = window.localStorage.getItem('mycv-theme');
        } catch (error) {
          // Continue with the system preference if storage is unavailable.
        }

        var prefersLight =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : prefersLight
              ? 'light'
              : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.background = theme === 'light' ? '#ffffff' : '#070a10';
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute('content', theme === 'light' ? '#0f2f63' : '#070a10');
        }
      })();
    </script>
    <script>
      (function (location) {
        if (location.search.charAt(0) === '?' && location.search.charAt(1) === '/') {
          var route = location.search
            .slice(1)
            .split('&')
            .map(function (part) {
              return part.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', location.pathname.slice(0, -1) + route + location.hash);
        }
      })(window.location);
    </script>
    <style>
      html {
        background: #0f2f63;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
